# KantinFlow visual defaults for FlatLaf 3.8.
# Registered with FlatLaf.registerCustomDefaultsSource("kantinflow").
@accentColor = #1D4ED8
@componentAccentColor = #1D4ED8
@selectionBackground = #DBEAFE
@selectionForeground = #0F172A
@Component.arc = 10
Button.arc = 10
TextComponent.arc = 10
CheckBox.arc = 6
ScrollBar.width = 8
ScrollBar.thumbArc = 8
ScrollBar.trackArc = 8
ScrollBar.hoverThumbColor = #94A3B8
ScrollBar.thumbColor = #CBD5E1
Table.showVerticalLines = false
Table.showHorizontalLines = true
Table.rowHeight = 40
TableHeader.height = 44
TableHeader.separatorColor = #E2E8F0
Component.focusWidth = 1
Component.innerFocusWidth = 1
Component.focusColor = #1D4ED8
Button.margin = 10, 16, 10, 16
Button.default.margin = 10, 16, 10, 16
ToggleButton.arc = 10
ToolTip.background = #0F172A
ToolTip.foreground = #F8FAFC

# Background light: #F4F6FA; surface: #FFFFFF.
# Text: #0F172A; border: #E2E8F0.
