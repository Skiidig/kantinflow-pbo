# KantinFlow Modern Minimalist (Zinc/Slate) defaults for FlatLaf 3.8.
# Registered with FlatLaf.registerCustomDefaultsSource("kantinflow").
@accentColor = #18181B
@componentAccentColor = #18181B
@background = #FAFAFA
@selectionBackground = #F1F5F9
@selectionForeground = #09090B
@Component.arc = 10
Button.arc = 10
TextComponent.arc = 10
CheckBox.arc = 6
ToggleButton.arc = 10

Component.borderColor = #E4E4E7
Component.disabledBorderColor = #F4F4F5
Component.focusedBorderColor = #18181B
Component.hoverBorderColor = #A1A1AA
Component.focusWidth = 1
Component.innerFocusWidth = 0
Component.focusColor = #18181B2E

TextComponent.placeholderForeground = #A1A1AA

ScrollBar.width = 8
ScrollBar.showButtons = false
ScrollBar.thumbArc = 999
ScrollBar.trackArc = 999
ScrollBar.thumbInsets = 2, 2, 2, 2
ScrollBar.track = #00000000
ScrollBar.thumb = #18181B28
ScrollBar.hoverThumbColor = #18181B55
ScrollBar.pressedThumbColor = #18181B80

Table.showVerticalLines = false
Table.showHorizontalLines = true
Table.gridColor = #F4F4F5
Table.rowHeight = 44
TableHeader.height = 38
TableHeader.background = #FAFAFA
TableHeader.foreground = #71717A
TableHeader.separatorColor = #E4E4E7
TableHeader.bottomSeparatorColor = #E4E4E7

TabbedPane.underlineColor = #18181B
TabbedPane.hoverColor = #F4F4F5
TabbedPane.selectedForeground = #09090B
TabbedPane.foreground = #71717A
TabbedPane.contentAreaColor = #E4E4E7
TabbedPane.tabHeight = 38

TitlePane.unifiedBackground = true
TitlePane.background = #FAFAFA
TitlePane.inactiveBackground = #FAFAFA
TitlePane.foreground = #09090B
TitlePane.inactiveForeground = #71717A
TitlePane.borderColor = #E4E4E7

Button.margin = 8, 16, 8, 16
Button.default.margin = 8, 16, 8, 16

ToolTip.background = #18181B
ToolTip.foreground = #FAFAFA
